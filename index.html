<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <script src="https://unpkg.com/axios@1.6.7/dist/axios.min.js"></script>
    <title>AI Cook Book Generator</title>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>AI Cook Book Generator</h1>
      </header>
      <main>
        <div class="form-container">
          <form id="cook-book-generator">
            <input
              type="text"
              placeholder="Enter the food you want to make"
              name=""
              id="user-instructions"
              autofocus
              required
              autocomplete="off"
              class="instructions"
            />
            <input type="submit" value="Submit" class="submit-button" />
          </form>
          <div class="hint">i.e: apple pie, chocolate chips cookie</div>
        </div>
        <div class="recipe" id="recipe"></div>
      </main>
      <footer>
        The AI project was cooded by Feiling and is
        <a href="https://github.com/ling83-ft/Shecodes_AI_Week2" target="_blank"
          >open-sourced on Github</a
        >
        and is
        <a href="https://ai-cook-book-generator.netlify.app/" target="_blank"
          >hosted on Netlify.</a
        >
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
